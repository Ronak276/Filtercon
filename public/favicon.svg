<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284C7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#fcGrad)" />
  
  <!-- Subtle Internal Glow Ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="white" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Iconic Water Droplet Motif with Filter Waves -->
  <g filter="url(#shadow)">
    <!-- Water Drop Shape -->
    <path
      d="M32 14 C32 14, 45 28.5, 45 37 C45 44.18 39.18 50 32 50 C24.82 50 19 44.18 19 37 C19 28.5, 32 14, 32 14 Z"
      fill="white"
    />
    <!-- Droplet Inner Wave Accent in Cyan -->
    <path
      d="M23.5 38.5 C26 36.5 29 36.5 32 38.5 C35 40.5 38 40.5 40.5 38.5 C40.8 41 39.5 44.5 36.5 46.5 C34.5 47.8 30 47.8 27.5 46.2 C24.8 44.4 23.5 41 23.5 38.5 Z"
      fill="#0284C7"
      opacity="0.9"
    />
    <!-- Droplet Pure Sparkle / Highlight -->
    <ellipse cx="27" cy="27" rx="2.5" ry="5" transform="rotate(-30 27 27)" fill="white" opacity="0.9" />
  </g>
</svg>
